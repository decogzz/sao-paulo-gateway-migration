apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager-store
  namespace: gateway-saopaulo
spec:
  provider:
    aws:
      service: SecretsManager
      region: sa-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: gateway-workload
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: processor-credentials
  namespace: gateway-saopaulo
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: aws-secretsmanager-store
  target:
    name: processor-credentials
    creationPolicy: Owner
  data:
    - secretKey: PROCESSOR_NAME
      remoteRef:
        key: sao-paulo-gateway-migration-dev/saopaulo/processor-credentials
        property: PROCESSOR_NAME
    - secretKey: PROCESSOR_API_KEY
      remoteRef:
        key: sao-paulo-gateway-migration-dev/saopaulo/processor-credentials
        property: PROCESSOR_API_KEY
    - secretKey: PROCESSOR_CERT_FINGERPRINT
      remoteRef:
        key: sao-paulo-gateway-migration-dev/saopaulo/processor-credentials
        property: PROCESSOR_CERT_FINGERPRINT
---
