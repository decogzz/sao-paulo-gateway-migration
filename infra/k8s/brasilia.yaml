apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-v1
  namespace: gateway-brasilia
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: payment-gateway
    app.kubernetes.io/part-of: sao-paulo-gateway-migration
    app.kubernetes.io/version: v1
    rollout.region: brasilia
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
      version: v1
      region: brasilia
  template:
    metadata:
      labels:
        app: gateway
        version: v1
        region: brasilia
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: payment-gateway
        app.kubernetes.io/part-of: sao-paulo-gateway-migration
        app.kubernetes.io/version: v1
    spec:
      serviceAccountName: gateway-workload
      containers:
        - name: gateway
          image: 123456789012.dkr.ecr.sa-east-1.amazonaws.com/sao-paulo-gateway-migration-v1:latest
          ports:
            - containerPort: 3000
          env:
            - name: REGION
              value: "brasilia"
            - name: GATEWAY_VERSION
              value: "v1"
          envFrom:
            - secretRef:
                name: processor-credentials
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-v2
  namespace: gateway-brasilia
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: payment-gateway
    app.kubernetes.io/part-of: sao-paulo-gateway-migration
    app.kubernetes.io/version: v2
    rollout.region: brasilia
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
      version: v2
      region: brasilia
  template:
    metadata:
      labels:
        app: gateway
        version: v2
        region: brasilia
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: payment-gateway
        app.kubernetes.io/part-of: sao-paulo-gateway-migration
        app.kubernetes.io/version: v2
    spec:
      serviceAccountName: gateway-workload
      containers:
        - name: gateway
          image: 123456789012.dkr.ecr.sa-east-1.amazonaws.com/sao-paulo-gateway-migration-v2:latest
          ports:
            - containerPort: 3000
          env:
            - name: REGION
              value: "brasilia"
            - name: GATEWAY_VERSION
              value: "v2"
          envFrom:
            - secretRef:
                name: processor-credentials
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-v1
  namespace: gateway-brasilia
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/version: v1
    rollout.region: brasilia
spec:
  selector:
    app: gateway
    version: v1
    region: brasilia
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-v2
  namespace: gateway-brasilia
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/version: v2
    rollout.region: brasilia
spec:
  selector:
    app: gateway
    version: v2
    region: brasilia
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-primary
  namespace: gateway-brasilia
  labels:
    app.kubernetes.io/name: gateway
    rollout.region: brasilia
spec:
  ingressClassName: nginx
  rules:
    - host: brasilia.gateway.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-v1
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-canary
  namespace: gateway-brasilia
  labels:
    app.kubernetes.io/name: gateway
    rollout.region: brasilia
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  ingressClassName: nginx
  rules:
    - host: brasilia.gateway.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-v2
                port:
                  number: 80
