upstream gateway_v1 {
  server gateway-v1-rio:3000 max_fails=3 fail_timeout=5s;
  keepalive 32;
}

upstream gateway_v2 {
  server gateway-v2-rio:3000 max_fails=3 fail_timeout=5s;
  keepalive 32;
}

split_clients "${remote_addr}${request_uri}${msec}" $gateway_pool {
  50% "v2";
  *      "v1";
}

map $gateway_pool $upstream_url {
  default "http://gateway_v1";
  "v2"    "http://gateway_v2";
}

server {
  listen 8080;
  server_name _;

  add_header X-Region "rio" always;
  add_header X-Rollout-Phase "phase-2" always;
  add_header X-Selected-Version $gateway_pool always;

  location = /health {
    access_log off;
    return 200 "router-ok (rio, phase-2)\n";
  }

  location = /rollout {
    default_type application/json;
    return 200 '{"region":"rio","phase":"2","v2_percentage":50}';
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Region "rio";

    proxy_connect_timeout 1s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    proxy_pass $upstream_url;
  }
}
